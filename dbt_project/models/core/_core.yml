version: 2

models:
  - name: dim_store
    description: One row per store.
    columns:
      - name: store_id
        description: Store identifier.
        data_tests: [unique, not_null]
      - name: state_id
        description: US state of the store.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CA', 'TX', 'WI']

  - name: dim_supplier
    description: One row per supplier, with its quoted lead time and reliability.
    columns:
      - name: supplier_id
        description: Supplier identifier.
        data_tests: [unique, not_null]
      - name: cat_id
        description: The only category this supplier serves.
        data_tests: [not_null]
      - name: quoted_lead_days
        description: Days promised between order and delivery.
        data_tests: [not_null]
      - name: late_rate
        description: Share of deliveries that arrive late (1-4 days).
        data_tests: [not_null]
      - name: partial_rate
        description: Share of deliveries that arrive incomplete.
        data_tests: [not_null]

  - name: dim_product
    description: One row per product, with its category, supplier and ordering terms.
    columns:
      - name: item_id
        description: Product identifier.
        data_tests: [unique, not_null]
      - name: dept_id
        description: Department.
        data_tests: [not_null]
      - name: cat_id
        description: Category (FOODS, HOUSEHOLD, HOBBIES).
        data_tests: [not_null]
      - name: supplier_id
        description: The product's supplier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_id
      - name: pack_size
        description: Units per pack; orders are whole packs.
      - name: moq_packs
        description: Minimum order, in packs.
      - name: review_days
        description: Days between two stock reviews.
      - name: service_level
        description: Target probability of not running out between two deliveries.
      - name: z
        description: Service-level factor of the ordering policy.

  - name: dim_date
    description: One row per calendar day, with attributes to slice reports by.
    columns:
      - name: date
        description: Calendar day.
        data_tests: [unique, not_null]
      - name: d
        description: M5 day id (d_1, d_2, ...).
        data_tests: [unique, not_null]
      - name: wm_yr_wk
        description: Walmart week id; joins the prices.
        data_tests: [not_null]
      - name: year
        description: Calendar year.
      - name: quarter
        description: Quarter of the year (1 to 4).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: month
        description: Month number (1 to 12).
      - name: week_of_year
        description: ISO week number.
      - name: weekday
        description: Name of the day.
      - name: wday
        description: Day number in the Walmart week (Saturday = 1).
      - name: is_weekend
        description: True on Saturday and Sunday.
        data_tests: [not_null]
      - name: is_event_day
        description: True if at least one event falls on that day.
        data_tests: [not_null]
      - name: event_name_1
        description: First event of the day; null if none.
      - name: event_type_1
        description: Type of the first event; null if none.
      - name: event_name_2
        description: Second event of the day; null if none (rare).
      - name: event_type_2
        description: Type of the second event; null if none (rare).
      - name: snap_ca
        description: 1 if SNAP purchases are allowed that day in California.
      - name: snap_tx
        description: Same for Texas.
      - name: snap_wi
        description: Same for Wisconsin.

  - name: fct_sales
    description: >
      Demand fact, one row per store, product and day (the real M5 sales).
      demand_units is what customers wanted to buy.
    config:
      contract:
        enforced: true
    columns:
      - name: store_id
        data_type: varchar
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: item_id
        data_type: varchar
        description: Product identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: item_id
      - name: date
        data_type: date
        description: Calendar day.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: demand_units
        data_type: integer
        description: What customers wanted to buy that day (the real M5 sales).
        data_tests: [not_null]
      - name: sell_price
        data_type: decimal(8,2)
        description: Price that week; null if the product was not on sale.
      - name: is_on_sale
        data_type: boolean
        description: A price exists for that store, product and week.
        data_tests: [not_null]
      - name: demand_amount
        data_type: decimal(18,2)
        description: demand_units times sell_price; null if not on sale.

  - name: fct_inventory_daily
    description: >
      Inventory fact, one row per store, product and day (the simulator's daily
      record). Same grain as fct_sales. A stockout is a day with lost sales.
    config:
      contract:
        enforced: true
    columns:
      - name: store_id
        data_type: varchar
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: item_id
        data_type: varchar
        description: Product identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: item_id
      - name: date
        data_type: date
        description: Calendar day.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: is_on_sale
        data_type: boolean
        description: Product is on sale that day.
        data_tests: [not_null]
      - name: opening_units
        data_type: integer
        description: Launch delivery (not an order), on the first day of each on-sale stretch.
        data_tests: [not_null]
      - name: received_units
        data_type: integer
        description: Units that arrived from orders (does not include opening_units).
        data_tests: [not_null]
      - name: demand_units
        data_type: integer
        description: Customer demand that day.
        data_tests: [not_null]
      - name: sold_units
        data_type: integer
        description: Units the shelf really sold.
        data_tests: [not_null]
      - name: lost_sales_units
        data_type: integer
        description: Demand minus sold units.
        data_tests: [not_null]
      - name: expired_units
        data_type: integer
        description: Units thrown away because they expired (FOODS only).
        data_tests: [not_null]
      - name: shrunk_units
        data_type: integer
        description: Units lost to theft or damage (the computer does not see them).
        data_tests: [not_null]
      - name: cleared_units
        data_type: integer
        description: Stock removed on the first day after the product leaves the shelf.
        data_tests: [not_null]
      - name: record_error_units
        data_type: integer
        description: Error in the computer's stock on an error day (0 otherwise).
        data_tests: [not_null]
      - name: count_adjustment_units
        data_type: integer
        description: Correction made by a stock count (shelf minus computer); 0 without a count.
        data_tests: [not_null]
      - name: end_stock_units
        data_type: integer
        description: Physical stock at the end of the day.
        data_tests: [not_null]
      - name: system_stock_units
        data_type: integer
        description: Stock the computer believes is on the shelf.
        data_tests: [not_null]
      - name: ordered_units
        data_type: integer
        description: Units ordered that day.
        data_tests: [not_null]
      - name: on_order_units
        data_type: integer
        description: Ordered units that have not arrived yet.
        data_tests: [not_null]
      - name: is_stockout
        data_type: boolean
        description: True when demand could not be fully served (lost_sales_units above 0).
        data_tests: [not_null]
      - name: stock_gap_units
        data_type: integer
        description: system_stock_units minus end_stock_units; positive means ghost units in the computer.

  - name: fct_purchase_orders
    description: One row per order placed; the expectation, not the outcome.
    config:
      contract:
        enforced: true
    columns:
      - name: purchase_order_id
        data_type: varchar
        description: Order identifier, made by us.
        data_tests: [unique, not_null]
      - name: store_id
        data_type: varchar
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: item_id
        data_type: varchar
        description: Product identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: item_id
      - name: order_date
        data_type: date
        description: Day the order was placed.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: expected_date
        data_type: date
        description: Day the delivery is promised.
        data_tests: [not_null]
      - name: ordered_units
        data_type: integer
        description: Quantity ordered (whole packs).
        data_tests: [not_null]

  - name: fct_deliveries
    description: >
      One row per delivery received (one per delivered order). Cancelled orders and
      orders arriving after the last simulated day are not included.
    config:
      contract:
        enforced: true
    columns:
      - name: delivery_id
        data_type: varchar
        description: Delivery identifier, made by us.
        data_tests: [unique, not_null]
      - name: purchase_order_id
        data_type: varchar
        description: The order this delivery answers.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_purchase_orders')
                field: purchase_order_id
      - name: store_id
        data_type: varchar
        description: Store identifier.
        data_tests: [not_null]
      - name: item_id
        data_type: varchar
        description: Product identifier.
        data_tests: [not_null]
      - name: arrival_date
        data_type: date
        description: Day the goods arrived.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: ordered_units
        data_type: integer
        description: Quantity ordered.
        data_tests: [not_null]
      - name: delivered_units
        data_type: integer
        description: Quantity received.
        data_tests: [not_null]
      - name: days_late
        data_type: integer
        description: Arrival date minus the promised date.
        data_tests: [not_null]
      - name: promised_lead_days
        data_type: bigint
        description: Days between the order and the promised date.
      - name: actual_lead_days
        data_type: bigint
        description: Days between the order and the arrival.
      - name: fill_rate
        data_type: double
        description: delivered_units divided by ordered_units.
      - name: is_on_time
        data_type: boolean
        description: Arrived on the promised day.
      - name: is_in_full
        data_type: boolean
        description: Quantity received is at least the quantity ordered.
      - name: is_otif
        data_type: boolean
        description: On time and in full.

  - name: dim_product_class
    description: >
      ABC (importance) and XYZ (predictability) class of each product in each store,
      over the last 52 weeks ending on the clock date.
    columns:
      - name: store_id
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: item_id
        description: Product identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: item_id
      - name: revenue_amount_52w
        description: Value of the demand in the last 52 weeks.
        data_tests: [not_null]
      - name: revenue_rank
        description: Rank by revenue within the store (1 = best).
        data_tests: [not_null]
      - name: cumulative_revenue_share
        description: Share of the store's revenue made by this product and all better ones.
      - name: abc_class
        description: A (first 80% of revenue), B (next 15%), C (last 5%).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
      - name: active_weeks
        description: Weeks (out of 52) in which the product was on sale.
        data_tests: [not_null]
      - name: weekly_demand_cv
        description: Standard deviation divided by the mean of weekly demand, over active weeks.
      - name: xyz_class
        description: X below 0.5, Y below 1.0, Z from 1.0; null with fewer than 4 active weeks.
        data_tests:
          - accepted_values:
              arguments:
                values: ['X', 'Y', 'Z']