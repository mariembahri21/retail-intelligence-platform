version: 2

models:
  - name: mart_sales_daily
    description: >
      Sales per day for dashboards, one row per store, category and day.
      revenue + lost_revenue = demand_amount.
    columns:
      - name: store_id
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: cat_id
        description: Category (FOODS, HOUSEHOLD, HOBBIES).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FOODS', 'HOUSEHOLD', 'HOBBIES']
      - name: date
        description: Calendar day.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: demand_units
        description: Units customers wanted to buy.
        data_tests: [not_null]
      - name: sold_units
        description: Units the shelf really sold.
        data_tests: [not_null]
      - name: lost_sales_units
        description: Demand that could not be served.
        data_tests: [not_null]
      - name: demand_amount
        description: Value of the demand (units x price); products not on sale count as 0.
      - name: revenue
        description: Value of the units really sold.
      - name: lost_revenue
        description: Value of the lost sales.
      - name: avg_price
        description: Average price of the demand of products that were on sale.

  - name: mart_product_performance
    description: >
      One row per store and product over the last 52 weeks, with ABC and XYZ classes
      and a 28-day trend.
    columns:
      - name: store_id
        description: Store identifier.
        data_tests: [not_null]
      - name: item_id
        description: Product identifier.
        data_tests: [not_null]
      - name: cat_id
        description: Category.
        data_tests: [not_null]
      - name: abc_class
        description: A, B or C by share of the store's revenue.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['A', 'B', 'C']
      - name: xyz_class
        description: X, Y or Z by variability of weekly demand; null if there is not enough history.
        data_tests:
          - accepted_values:
              arguments:
                values: ['X', 'Y', 'Z']
      - name: units_52w
        description: Units demanded in the last 52 weeks.
      - name: revenue_amount_52w
        description: Value of the demand in the last 52 weeks.
      - name: revenue_rank
        description: Rank by revenue within the store (1 = best).
      - name: cumulative_revenue_share
        description: Share of the store's revenue made by this product and all better ones.
      - name: units_last_28d
        description: Units demanded in the last 28 days.
      - name: units_prev_28d
        description: Units demanded in the 28 days before that.
      - name: trend_28d
        description: Change of the last 28 days against the 28 days before; null if there were no sales before.
  
  - name: mart_inventory_health
    description: >
      Inventory health per store, product and week (Monday start), on-sale days only:
      stock level, turnover, days of cover, overstock, waste and stockouts.
    columns:
      - name: store_id
        description: Store identifier.
        data_tests: [not_null]
      - name: item_id
        description: Product identifier.
        data_tests: [not_null]
      - name: week_start_date
        description: Monday of the week.
        data_tests: [not_null]
      - name: days_on_sale
        description: Days of the week on which the product was on sale (1 to 7).
        data_tests: [not_null]
      - name: demand_units
        description: Units customers wanted that week.
      - name: sold_units
        description: Units really sold.
      - name: lost_sales_units
        description: Demand that could not be served.
      - name: avg_stock_units
        description: Average end-of-day shelf stock.
      - name: turnover
        description: Units sold divided by average stock; null if the average stock is 0.
      - name: days_of_cover
        description: Average stock divided by average daily demand; null if there was no demand.
      - name: overstock_day_rate
        description: Share of days with stock above 28 days of cover.
      - name: waste_units
        description: Expired + shrunk + cleared units.
      - name: waste_rate
        description: Lost units divided by (units sold + lost units).
      - name: stockout_day_rate
        description: Share of days with lost sales.

  - name: mart_supplier_performance
    description: >
      Supplier reliability per month of arrival: on time, in full, OTIF, fill rate,
      lateness and lead-time variability.
    columns:
      - name: supplier_id
        description: Supplier identifier.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: supplier_id
      - name: month_start_date
        description: First day of the month of arrival.
        data_tests: [not_null]
      - name: deliveries
        description: Number of deliveries received.
        data_tests: [not_null]
      - name: ordered_units
        description: Units ordered on those deliveries' orders.
      - name: delivered_units
        description: Units received.
      - name: fill_rate
        description: Units delivered divided by units ordered.
      - name: on_time_rate
        description: Share of deliveries that arrived on the promised day.
      - name: in_full_rate
        description: Share of deliveries that brought everything ordered.
      - name: otif_rate
        description: Share of deliveries that were on time and in full.
      - name: avg_days_late
        description: Average days late (0 when on time).
      - name: avg_lead_days
        description: Average real lead time in days.
      - name: lead_time_sd
        description: Standard deviation of the real lead time; null with one delivery.
