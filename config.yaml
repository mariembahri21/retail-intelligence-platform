project:
  name: retail-intelligence-platform
  seed: 42
data:
  raw_dir: data/raw
  start_date: "2011-01-29"
  end_date: "2016-05-22"
scope:
  stores: [CA_1, TX_1, WI_1]
  #all items sold in those stores are included (about 3,049)
periods:
  burn_in:     ["2011-01-29", "2011-02-25"]
  block_a:     ["2011-02-26", "2014-06-30"]
  gap_1:       ["2014-07-01", "2014-07-07"]
  block_b:     ["2014-07-08", "2015-06-23"]
  gap_2:       ["2015-06-24", "2015-06-30"]
  live_test:   ["2015-07-01", "2016-04-30"]
  live_replay: ["2016-05-01", "2016-05-22"]
warehouse:
  path: data/processed/retail.duckdb

simulation:
  moq_packs: 2                    # minimum order quantity, in packs
  partial_rate_range: [0.03, 0.07]  # share of deliveries that arrive incomplete #store's policy
  partial_fill_range: [0.6, 0.9]    # a partial delivery brings 60% to 90% of the order
  categories:
    FOODS:
      n_suppliers: 4
      quoted_lead_days: 2
      late_rate_range: [0.05, 0.10] #suppliers’ behaviour
      pack_size: 6
      review_days: 1
      service_level: 0.95 #the store’s target: how much safety stock it plans for.
    HOUSEHOLD:
      n_suppliers: 3
      quoted_lead_days: 4
      late_rate_range: [0.10, 0.15]
      pack_size: 12
      review_days: 3
      service_level: 0.92
    HOBBIES:
      n_suppliers: 3
      quoted_lead_days: 7
      late_rate_range: [0.15, 0.25]
      pack_size: 4
      review_days: 7
      service_level: 0.90
  losses:
    shrink_rate: 0.0003
    record_error_rate: 0.003
    count_every_days: 28
    expiry_rate:
      FOODS: 0.004
      HOUSEHOLD: 0.0
      HOBBIES: 0.0